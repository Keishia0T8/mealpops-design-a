<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=1440">
<title>Set your password, Meal POPs Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=DM+Sans:opsz,wght@9..40,400..700&amp;display=swap">
<style>
body{margin:0;background:#FFF6EA}
a{color:#1D1B16;text-decoration:none}a:hover{color:#B02E17}
.mp-input:focus{outline:none;border-color:#1D1B16;box-shadow:0 0 0 3px rgba(217,58,31,0.18)}
</style>
<style>button,a,label[for],summary{cursor:pointer}button:hover:not(:disabled){filter:brightness(0.92)}button:active:not(:disabled){transform:translateY(1px)}button:disabled{cursor:wait}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #F6B92B;outline-offset:2px}</style>
<script src="/motion.js" defer></script>
</head>
<body data-admin-page="setpassword">
<div style="margin: 0 auto; width: 1440px; height: 900px; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; background: #FFF6EA; color: #1D1B16; font-family: 'DM Sans', 'Helvetica Neue', Helvetica, sans-serif">
<div style="position: absolute; width: 360px; height: 360px; border-radius: 50%; background: #F6B92B; left: -140px; bottom: -160px"></div>
<div style="position: absolute; width: 110px; height: 110px; border-radius: 50%; background: #D93A1F; right: 120px; top: 140px"></div>

<header style="position: relative; width: 100%; box-sizing: border-box; padding: 40px 72px; display: flex; justify-content: space-between; align-items: center">
<a href="/AdminLogin.html" style="display: flex; align-items: center; gap: 12px"><span style="width: 40px; height: 40px; border-radius: 50%; background: #D93A1F; display: flex; align-items: center; justify-content: center"><span style="width: 14px; height: 14px; border-radius: 50%; background: #F6B92B"></span></span><span style="font-family: 'Bricolage Grotesque', Georgia, serif; font-weight: 800; font-size: 26px; letter-spacing: -0.5px">Meal POPs</span><span style="margin-left: 6px; padding: 5px 12px; border-radius: 999px; background: #1D1B16; color: #F6B92B; font-size: 12px; font-weight: 700; letter-spacing: 1.5px">ADMIN</span></a>
<a href="/AdminLogin.html" style="font-size: 15px; font-weight: 600; color: #4F493F">Back to sign in</a>
</header>

<main style="position: relative; margin: auto 0; width: 480px; display: flex; flex-direction: column; gap: 28px; padding-bottom: 80px">
<div style="display: flex; flex-direction: column; gap: 12px; text-align: center">
<span style="font-size: 14px; font-weight: 700; letter-spacing: 2px; color: #D93A1F">ADMIN ACCOUNT</span>
<h1 id="mp-title" style="margin: 0; font-family: 'Bricolage Grotesque', Georgia, serif; font-weight: 800; font-size: 52px; line-height: 1; letter-spacing: -2px">Set your password</h1>
<p id="mp-sub" style="margin: 0; font-size: 18px; line-height: 1.55; color: #4F493F">Choose a password with at least 8 characters. You'll use it with your email to sign in.</p>
</div>
<div id="mp-form" style="background: #FFFFFF; border: 1.5px solid #EADFCD; border-radius: 28px; padding: 36px; display: flex; flex-direction: column; gap: 20px">
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 15px; font-weight: 700">New password
<input id="mp-new" class="mp-input" type="password" autocomplete="new-password" placeholder="At least 8 characters" style="height: 54px; box-sizing: border-box; border: 1.5px solid #CFC3AE; border-radius: 14px; padding: 0 16px; font-size: 16px; font-family: inherit; background: #FFFFFF; color: #1D1B16">
</label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 15px; font-weight: 700">Confirm password
<input id="mp-confirm" class="mp-input" type="password" autocomplete="new-password" placeholder="Type it again" style="height: 54px; box-sizing: border-box; border: 1.5px solid #CFC3AE; border-radius: 14px; padding: 0 16px; font-size: 16px; font-family: inherit; background: #FFFFFF; color: #1D1B16">
</label>
<div id="mp-msg" role="status" aria-live="polite" style="display: none; padding: 12px 14px; border-radius: 12px; font-size: 15px; line-height: 1.45"></div>
<button id="mp-save" type="button" style="height: 58px; margin-top: 4px; border: none; border-radius: 16px; background: #D93A1F; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700">Save password and continue</button>
</div>
</main>
</div>

<script src="/supabase.js"></script>
<script src="/admin-config.js"></script>
<script src="/admin-auth.js"></script>
</body>
</html>
