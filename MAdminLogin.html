<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=390">
<title>Login, Meal POPs Admin, mobile</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=DM+Sans:opsz,wght@9..40,400..700&amp;display=swap">
<style>
body{margin:0;background:#FFF6EA}
a{color:#1D1B16;text-decoration:none}a:hover{color:#B02E17}
.mp-input:focus{outline:none;border-color:#1D1B16;box-shadow:0 0 0 3px rgba(217,58,31,0.18)}
</style>
<style>button,a,label[for],summary{cursor:pointer}button:hover:not(:disabled){filter:brightness(0.92)}button:active:not(:disabled){transform:translateY(1px)}button:disabled{cursor:wait}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #F6B92B;outline-offset:2px}</style>
</head>
<body data-admin-page="login">
<div style="margin: 0 auto; width: 390px; height: 844px; display: flex; flex-direction: column; background: #FFF6EA; color: #1D1B16; font-family: 'DM Sans', 'Helvetica Neue', Helvetica, sans-serif; overflow: hidden">

<section style="position: relative; overflow: hidden; background: #D93A1F; color: #FFFFFF; box-sizing: border-box; padding: 20px 20px 32px; display: flex; flex-direction: column; gap: 28px; border-radius: 0 0 32px 32px">
<div style="position: absolute; width: 140px; height: 140px; border-radius: 50%; background: #F6B92B; right: -64px; bottom: -76px"></div>
<div style="position: relative; display: flex; justify-content: space-between; align-items: center">
<a href="/Mobile.html" style="display: flex; align-items: center; gap: 10px; color: #FFFFFF"><span style="width: 32px; height: 32px; border-radius: 50%; background: #FFF6EA; display: flex; align-items: center; justify-content: center"><span style="width: 11px; height: 11px; border-radius: 50%; background: #F6B92B"></span></span><span style="font-family: 'Bricolage Grotesque', Georgia, serif; font-weight: 800; font-size: 22px">Meal POPs</span></a>
<span style="padding: 5px 12px; border-radius: 999px; background: #1D1B16; color: #F6B92B; font-size: 11px; font-weight: 700; letter-spacing: 1.5px">ADMIN</span>
</div>
<h1 style="position: relative; margin: 0; font-family: 'Bricolage Grotesque', Georgia, serif; font-weight: 800; font-size: 34px; line-height: 1.02; letter-spacing: -1px; max-width: 280px">Every restaurant, voucher and member in one admin.</h1>
</section>

<section style="box-sizing: border-box; padding: 32px 20px 24px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 2px; color: #D93A1F">ADMIN PORTAL</span>
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', Georgia, serif; font-weight: 800; font-size: 38px; line-height: 1; letter-spacing: -1px">Welcome back</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #4F493F">Sign in with your Meal POPs admin account.</p>
</div>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 700">Email
<input id="mp-email" class="mp-input" type="email" autocomplete="username" placeholder="you@mealpops.com" style="height: 54px; box-sizing: border-box; border: 1.5px solid #CFC3AE; border-radius: 14px; padding: 0 16px; font-size: 16px; font-family: inherit; background: #FFFFFF; color: #1D1B16">
</label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 700"><span style="display: flex; justify-content: space-between; align-items: baseline">Password<a id="mp-forgot" href="#forgot" style="font-size: 14px; font-weight: 600; color: #D93A1F">Forgot password?</a></span>
<span style="position: relative; display: block">
<input id="mp-password" class="mp-input" type="password" autocomplete="current-password" placeholder="Your password" style="width: 100%; height: 54px; box-sizing: border-box; border: 1.5px solid #CFC3AE; border-radius: 14px; padding: 0 76px 0 16px; font-size: 16px; font-family: inherit; background: #FFFFFF; color: #1D1B16">
<button type="button" onclick="var i=this.previousElementSibling;var s=i.type==='password';i.type=s?'text':'password';this.textContent=s?'Hide':'Show';this.setAttribute('aria-label',s?'Hide password':'Show password');" aria-label="Show password" style="position: absolute; right: 8px; top: 8px; height: 38px; padding: 0 12px; border: none; border-radius: 10px; background: #F2EDE4; color: #1D1B16; font-family: inherit; font-size: 14px; font-weight: 700">Show</button>
</span>
</label>
<div id="mp-msg" role="status" aria-live="polite" style="display: none; padding: 12px 14px; border-radius: 12px; font-size: 15px; line-height: 1.45"></div>
<button id="mp-signin" type="button" style="height: 56px; border: none; border-radius: 16px; background: #D93A1F; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700">Sign in</button>
<div style="display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: 16px; background: #FCEBC0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D1B16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg><span style="font-size: 14px; line-height: 1.5; color: #3E392F">Access is by invitation. Ask an existing admin if you need an account.</span></div>
</section>

<a href="/Mobile.html" style="margin-top: auto; margin-bottom: 28px; align-self: center; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: #4F493F"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="11 18 5 12 11 6"></polyline></svg>Back to mealpops.com</a>
</div>

<script src="/supabase.js"></script>
<script src="/admin-config.js"></script>
<script src="/admin-auth.js"></script>
</body>
</html>
